<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe3">
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0f151c">
    <title>Посилання недійсне</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --paper: #f4efe3;
            --card-bg: #fffdf8;
            --text: #0e1b2c;
            --muted: #5a5044;
            --line: rgba(31,42,58,.13);
            --shadow: 0 12px 32px -12px rgba(14,27,44,.18);
            --page-bg: linear-gradient(180deg, #f4efe3 0%, #efe7d5 100%);
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #0f151c;
                --card-bg: #1a222b;
                --text: #e7e2d6;
                --muted: #9aa3ad;
                --line: rgba(231,226,214,.14);
                --shadow: 0 12px 32px -12px rgba(0,0,0,.55);
                --page-bg: linear-gradient(180deg, #0f151c 0%, #0a0f14 100%);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--page-bg);
            color: var(--text); padding: 1.5rem;
            -webkit-text-size-adjust: 100%;
        }
        .card {
            max-width: 480px; width: 100%; text-align: center;
            background: var(--card-bg); border-radius: 20px;
            box-shadow: var(--shadow); border: 1px solid var(--line);
            padding: 2.5rem 1.75rem;
        }
        .icon-wrap {
            width: 68px; height: 68px; margin: 0 auto 1.25rem;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(162,59,46,.12);
            color: #a23b2e;
            font-size: 1.9rem;
        }
        @media (prefers-color-scheme: dark) {
            .icon-wrap {
                background: rgba(240,179,171,.15); color: #f0b3ab;
            }
        }
        h1 {
            margin: 0 0 .6rem; font-size: 1.25rem;
            font-weight: 700; color: var(--text);
        }
        p {
            margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.55;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap"><i class="bi bi-x-circle-fill"></i></div>
    <h1>Посилання недійсне або прострочене</h1>
    <p>Зверніться до відповідального за сесію за новим посиланням.</p>
</div>
</body>
</html>
