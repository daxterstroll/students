{% extends 'layout.html' %}
{% import '_macros.html' as ui %}
{% block title %}Нова сесія{% endblock %}
{% block main_class %}py-3{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:640px">
  {{ ui.page_header('bi-plus-circle', 'Нова сесія', '') }}
  <a href="{{ url_for('exam_sessions.sessions_list') }}" class="btn btn-sm btn-outline-secondary mb-3">← Назад</a>

  <form method="post" class="card card-body">
    <div class="mb-3">
      <label class="form-label">Група *</label>
      <select name="group_id" class="form-select" required>
        <option value="">— оберіть —</option>
        {% for g in groups %}
        <option value="{{ g.id }}">{{ g.name }} ({{ g.start_year }}, {{ g.study_form }}, курс {{ g.course }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="row g-2">
      <div class="col-md-6 mb-3">
        <label class="form-label">Навчальний рік *</label>
        <input type="text" name="academic_year" class="form-control" placeholder="2026–2027" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Семестр *</label>
        <select name="semester" class="form-select" required>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Назва сесії</label>
      <input type="text" name="name" class="form-control" placeholder="Авто: Сесія N семестру РІК">
    </div>
    <div class="mb-3">
      <label class="form-label">Примітки</label>
      <textarea name="notes" class="form-control" rows="2"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Створити</button>
  </form>
</div>
{% endblock %}
