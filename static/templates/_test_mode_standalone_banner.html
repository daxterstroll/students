{% if test_mode is defined and test_mode.active %}
<div role="alert" style="position:relative;z-index:9999;background:repeating-linear-gradient(-45deg,#fff3cd,#fff3cd 12px,#ffe69c 12px,#ffe69c 24px);color:#533600;border-bottom:2px solid #d39e00;padding:10px 16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;line-height:1.4;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.15);">
    <span style="display:inline-block;background:#8a2518;color:#fff;font-weight:800;font-size:11px;letter-spacing:.05em;padding:2px 8px;border-radius:5px;text-transform:uppercase;margin-right:8px;vertical-align:middle;">Тестовий режим</span>
    <strong>УВАГА:</strong> система працює в тестовому режимі (копія БД{% if test_mode.started_at %} від {{ test_mode.started_at }}{% endif %}).
    <strong>Усі збереження та зміни не будуть збережені</strong> після завершення тестування.
</div>
{% endif %}
