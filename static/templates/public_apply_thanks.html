<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Заявку прийнято — Європейський університет</title>
    <style>
        /* Без зовнішніх CSS/шрифтів - той самий принцип, що й у
           public_apply.html (див. коментар там). */
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f5f7; color: #1b1b1b;
        }
        .container { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 1rem; }
        .card { background: #fff; border: 1px solid rgba(0,0,0,.125); border-radius: .5rem; }
        .card-body { padding: 1.5rem; }
        @media (min-width: 768px) { .card-body { padding: 3rem; } }
        .shadow-sm { box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); }
        h4 { margin: 0 0 .5rem; font-size: 1.3rem; font-weight: 600; }
        .text-muted { color: #6c757d; }
        .text-success { color: #198754; }
        .mb-0 { margin-bottom: 0; }
        .mt-3 { margin-top: 1rem; }

        .thanks-card { max-width: 480px; margin: 0 auto; text-align: center; }
        .check-icon { font-size: 3rem; line-height: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="thanks-card">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="check-icon text-success">✓</div>
                <h4 class="mt-3 mb-2">Дякуємо, заявку прийнято</h4>
                <p class="text-muted mb-0">Приймальна комісія опрацює ваші дані. Якщо знадобиться уточнення — з вами зв'яжуться за вказаним телефоном.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
